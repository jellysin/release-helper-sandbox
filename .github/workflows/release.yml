name: Publish exact release tag
run-name: Publish ${{ github.ref_name }}
# Packages the fixture plugin on the exact tag, attests every artifact and publishes the draft with
# release-helper's package and publish actions, taken from the release-helper commit under test.
# release-helper verifies the attestation against this file at refs/tags/<tag>, so it runs on the tag.
on:
  workflow_dispatch:
    inputs:
      helper:
        description: Full SHA of the jellysin/release-helper commit under test.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Package, attest and publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Refuse a release-helper reference that is not a full commit SHA
        env:
          HELPER: ${{ inputs.helper }}
        run: '[[ "$HELPER" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact tag to belong to main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check out the release-helper commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellysin/release-helper
          ref: ${{ inputs.helper }}
          path: .release-helper
          persist-credentials: false
      - name: Package the fixture plugin
        id: package
        uses: ./.release-helper/actions/package
        with:
          publish-directory: plugin/publish
          metadata-path: plugin/plugin.json
          tag: ${{ github.ref_name }}
          output-directory: ${{ runner.temp }}/dist
      - name: Verify bytes and attestations, upload to the draft and publish
        uses: ./.release-helper/actions/publish
        with:
          directory: ${{ steps.package.outputs.directory }}
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
