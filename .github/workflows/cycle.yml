name: Release cycle
run-name: Release cycle of release-helper ${{ inputs.helper || 'main' }}
# One full release of the fixture plugin with release-helper from one commit, the way a consumer runs it:
# a releasable change lands through a pull request, release-helper's reusable release-please workflow
# opens the release PR, the cycle merges it, prepares the tag and the draft, packages, attests and
# publishes on the tag, imports the release into the catalog, checks forge and catalog, sees the merged
# release PR marked tagged and lands the catalog through a pull request. main is protected: every write
# is a pull request whose CI the cycle approves, fail closed, and squash-merges when the forge reports it
# CLEAN (.github/scripts/land.py). The
# release-helper commit under test is a notice annotation ("release-helper <sha>") that
# jellysin/release-helper reads to report the cycle on its own main.
on:
  workflow_dispatch:
    inputs:
      helper:
        description: Full SHA of the jellysin/release-helper commit under test; empty takes its main head.
        required: false
        type: string
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: release-cycle
  cancel-in-progress: false
jobs:
  cycle:
    name: Release cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release-helper commit under test
        id: helper
        env:
          REQUESTED: ${{ inputs.helper }}
        run: |
          helper="${REQUESTED:-$(gh api repos/jellysin/release-helper/commits/main --jq .sha)}"
          [[ "$helper" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$helper" >> "$GITHUB_OUTPUT"
          echo "::notice title=release-helper::$helper"
          echo "CYCLE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Land a releasable change through a pull request
        env:
          HELPER: ${{ steps.helper.outputs.sha }}
        run: |
          mkdir -p cycle
          printf 'release-helper %s\ncycle run %s\n' "$HELPER" "$GITHUB_RUN_ID" > cycle/last-run.txt
          python3 .github/scripts/land.py land "cycle/$GITHUB_RUN_ID-change" "fix: release cycle of release-helper $HELPER" cycle/last-run.txt
      - name: Open the release PR with release-helper's reusable release-please workflow
        id: release-pr
        run: |
          gh workflow run release-automation.yml --ref main -f cycle="$GITHUB_RUN_ID-open"
          .github/scripts/watch-run.sh release-automation.yml "Release PR for cycle $GITHUB_RUN_ID-open"
          pr="$(gh pr list --state open --label 'autorelease: pending' --json number,title,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--branches--main"))][0] | "\(.number) \(.title)"')"
          number="${pr%% *}"
          title="${pr#* }"
          [[ "$title" =~ ^chore\(main\):\ release\ [0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no release PR: '$pr'" >&2; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "release PR #$number: $title"
      - name: Merge the release PR when CLEAN and read the version it records
        id: version
        env:
          NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          python3 .github/scripts/land.py merge "$NUMBER"
          commit="$(gh pr view "$NUMBER" --json mergeCommit --jq .mergeCommit.oid)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet origin main
          version="$(git show "$commit:version.txt" | tr -d '\n')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version $version merged as $commit"
      - name: Prepare the tag and the draft
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          HELPER: ${{ steps.helper.outputs.sha }}
        run: |
          gh workflow run prepare-release.yml --ref main -f tag="$TAG" -f commit="$COMMIT" -f helper="$HELPER"
          .github/scripts/watch-run.sh prepare-release.yml "Prepare $TAG"
      - name: Package, attest and publish on the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          HELPER: ${{ steps.helper.outputs.sha }}
        run: |
          gh workflow run release.yml --ref "$TAG" -f helper="$HELPER"
          .github/scripts/watch-run.sh release.yml "Publish $TAG"
      - name: Check out the release-helper commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellysin/release-helper
          ref: ${{ steps.helper.outputs.sha }}
          path: .release-helper
          persist-credentials: false
      - name: Import the release into the catalog
        uses: ./.release-helper/actions/catalog
        with:
          manifest: catalog/manifest.json
          allowlist: catalog/plugins.json
          token: ${{ github.token }}
      - name: Check the release on the forge and its catalog entry
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 .github/scripts/check-cycle.py "$TAG"
      - name: Mark the merged release PR tagged with the reusable workflow
        env:
          NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          gh workflow run release-automation.yml --ref main -f cycle="$GITHUB_RUN_ID-tagged"
          .github/scripts/watch-run.sh release-automation.yml "Release PR for cycle $GITHUB_RUN_ID-tagged"
          labels="$(gh pr view "$NUMBER" --json labels --jq '[.labels[].name] | sort | join(",")')"
          [[ ",$labels," == *",autorelease: tagged,"* && ",$labels," != *",autorelease: pending,"* ]] || { echo "release PR #$NUMBER labels: $labels" >&2; exit 1; }
          echo "release PR #$NUMBER labels: $labels"
      - name: Land the catalog through a pull request
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 .github/scripts/land.py land "cycle/$GITHUB_RUN_ID-catalog" "chore: import $TAG into the sandbox catalog" catalog/manifest.json
