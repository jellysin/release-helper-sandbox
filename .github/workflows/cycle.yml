name: Release cycle
run-name: Release cycle of release-helper ${{ inputs.helper || 'main' }}
# One full release of the fixture plugin with release-helper from one commit: a releasable commit, the
# release PR from release-helper's reusable release-please workflow, merged; then prepare the tag and the draft, package, attest and publish on the tag, import the release
# into the catalog and check what the forge and the catalog now hold. Every write uses this
# repository's job tokens; the dispatched runs use their own.
on:
  workflow_dispatch:
    inputs:
      helper:
        description: Full SHA of the jellysin/release-helper commit under test; empty takes its main head.
        required: false
        type: string
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: release-cycle
  cancel-in-progress: false
jobs:
  cycle:
    name: Release cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve the release-helper commit under test
        id: helper
        env:
          REQUESTED: ${{ inputs.helper }}
        run: |
          helper="${REQUESTED:-$(gh api repos/jellysin/release-helper/commits/main --jq .sha)}"
          [[ "$helper" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$helper" >> "$GITHUB_OUTPUT"
          echo "release-helper $helper"
      - name: Commit a releasable change on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --allow-empty --message "fix: release cycle of release-helper ${{ steps.helper.outputs.sha }}"
          git push --quiet origin HEAD:main
      - name: Open the release PR with release-helper's reusable release-please workflow
        id: release-pr
        run: |
          gh workflow run release-automation.yml --ref main -f cycle="$GITHUB_RUN_ID-open"
          .github/scripts/watch-run.sh release-automation.yml "Release PR for cycle $GITHUB_RUN_ID-open"
          pr="$(gh pr list --head release-please--branches--main --state open --json number,title --jq '.[0] | "\(.number) \(.title)"')"
          number="${pr%% *}"
          title="${pr#* }"
          [[ "$title" =~ ^chore\(main\):\ release\ [0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no release PR: '$pr'" >&2; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "release PR #$number: $title"
      - name: Merge the release PR and read the version it records
        id: version
        env:
          NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          gh pr merge "$NUMBER" --squash
          commit="$(gh pr view "$NUMBER" --json mergeCommit --jq .mergeCommit.oid)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet origin main
          git merge --ff-only --quiet origin/main
          version="$(git show "$commit:version.txt" | tr -d '\n')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version $version merged as $commit"
      - name: Prepare the tag and the draft
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          HELPER: ${{ steps.helper.outputs.sha }}
        run: |
          gh workflow run prepare-release.yml --ref main -f tag="$TAG" -f commit="$COMMIT" -f helper="$HELPER"
          .github/scripts/watch-run.sh prepare-release.yml "Prepare $TAG"
      - name: Package, attest and publish on the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          HELPER: ${{ steps.helper.outputs.sha }}
        run: |
          gh workflow run release.yml --ref "$TAG" -f helper="$HELPER"
          .github/scripts/watch-run.sh release.yml "Publish $TAG"
      - name: Check out the release-helper commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jellysin/release-helper
          ref: ${{ steps.helper.outputs.sha }}
          path: .release-helper
          persist-credentials: false
      - name: Import the release into the catalog
        uses: ./.release-helper/actions/catalog
        with:
          manifest: catalog/manifest.json
          allowlist: catalog/plugins.json
          token: ${{ github.token }}
      - name: Check the release on the forge and its catalog entry
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 .github/scripts/check-cycle.py "$TAG"
      - name: Mark the merged release PR tagged with the reusable workflow
        env:
          NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          gh workflow run release-automation.yml --ref main -f cycle="$GITHUB_RUN_ID-tagged"
          .github/scripts/watch-run.sh release-automation.yml "Release PR for cycle $GITHUB_RUN_ID-tagged"
          labels="$(gh pr view "$NUMBER" --json labels --jq '[.labels[].name] | sort | join(",")')"
          [[ ",$labels," == *",autorelease: tagged,"* && ",$labels," != *",autorelease: pending,"* ]] || { echo "release PR #$NUMBER labels: $labels" >&2; exit 1; }
          echo "release PR #$NUMBER labels: $labels"
      - name: Record the catalog on main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add catalog/manifest.json
          git commit --quiet --message "chore: import $TAG into the sandbox catalog"
          git push --quiet origin HEAD:main
